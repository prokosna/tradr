[package]
name = "tradr-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tradr-core = { path = "../tradr-core" }
tradr-proto = { path = "../tradr-proto" }
tradr-identity = { path = "../tradr-identity" }
tradr-oidc = { path = "../tradr-oidc" }
tradr-discovery = { path = "../tradr-discovery" }
tradr-transport = { path = "../tradr-transport" }
tradr-integrity = { path = "../tradr-integrity" }
tradr-vfs = { path = "../tradr-vfs" }
tradr-secrets = { path = "../tradr-secrets" }
dirs = "6"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
mdns-sd = "0.21"
blake3 = "1"
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[dev-dependencies]
base64 = "0.22"
dirs = "6"
flume = "0.12"
hostname = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["sync", "rt", "macros", "test-util", "net", "io-util"] }
