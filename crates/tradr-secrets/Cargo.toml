[package]
name = "tradr-secrets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tradr-core = { path = "../tradr-core" }

# Secret Service is a D-Bus interface Linux desktops provide; there is
# nothing on the other end of it anywhere else (WI-M0-016).
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
