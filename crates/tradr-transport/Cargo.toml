[package]
name = "tradr-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tradr-core = { path = "../tradr-core" }
tradr-proto = { path = "../tradr-proto" }
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
der = "0.7"
const-oid = { version = "0.9", features = ["db"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
blake3 = "1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", default-features = false, features = ["net", "sync", "rt"] }
snow = { version = "0.10", default-features = false, features = ["use-p256", "use-chacha20poly1305", "use-blake2", "use-curve25519", "std"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
blake3 = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
snow = { version = "0.10", default-features = false, features = ["use-p256", "use-chacha20poly1305", "use-blake2", "use-curve25519", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
