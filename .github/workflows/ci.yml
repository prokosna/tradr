name: CI

on:
  # DCR-036: one branch and one pull request per Work Item means the
  # pull_request trigger now runs on every Work Item instead of roughly
  # once per milestone. push is restricted to main so a branch with an
  # open pull request does not run every job twice on the same commits.
  push:
    branches:
      - main
  pull_request:
  # The full four-ABI release build (WI-M0-015b) does not run on every
  # push; a weekly run is the backstop that still exercises it even when
  # main goes quiet, so ADR-0001's third condition keeps being checked
  # rather than only hoped to still hold.
  schedule:
    - cron: "0 3 * * 1"

env:
  PNPM_VERSION: "10.20.0"
  NODE_VERSION: "24"
  # Pinned to what this workspace's Cargo.toml files already carry
  # (`features = []`); a mismatched CLI version is the thing most likely
  # to make `cargo tauri build`/`android build` behave differently here
  # than it did in local verification.
  TAURI_CLI_VERSION: "2.11.4"
  # Named once so the SDK/NDK cache key and the sdkmanager install list
  # can never drift apart (WI-M0-015b).
  ANDROID_NDK_VERSION: "27.3.13750724"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  # Mechanizes the seven checks in ci/*.sh: comment language and length,
  # doc visibility, the excuse-phrase grep, the invoke()/COMMANDS cross
  # check, the layer-dependency scan, and STATE.md/git-history agreement.
  checks:
    runs-on: ubuntu-latest
    steps:
      # ci/state-sync.sh greps `git log` for every DCR-N recorded in
      # STATE.md; actions/checkout's default fetch-depth of 1 would leave
      # every one of them looking absent from history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sh ci/run-all.sh

  # cargo fmt, clippy, the workspace test suite, and a workspace build.
  # The workspace includes apps/tradr/src-tauri, so even a plain
  # `cargo build` links against the host WebKitGTK stack on Linux.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml is the single source of truth for the channel
      # and components; this only makes rustup install what it names.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --locked --workspace

  # tsc and biome over the TypeScript workspace. Both `pnpm typecheck` and
  # `pnpm lint` run `buf generate` first (packages/protocol/src/gen is
  # gitignored), so this is also where that code generation is proven to
  # work from a clean checkout.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

  # cargo tauri build, evidence for ADR-0001's first two withdrawal
  # conditions on this platform and a build-health signal for the app
  # crate on its own host.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Cache tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}
      - name: Install tauri-cli
        run: |
          # Swatinem/rust-cache restores ~/.cargo/bin too, so the cache
          # step above reporting a miss does not mean cargo-tauri is
          # absent -- check the binary itself, not that step's report.
          installed_version="$(cargo-tauri --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$installed_version" = "${{ env.TAURI_CLI_VERSION }}" ]; then
            echo "cargo-tauri ${{ env.TAURI_CLI_VERSION }} already present, skipping install"
          else
            cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked --force
          fi

      # No TRADR_OAUTH_CLIENT_IDS / TRADR_OAUTH_CLIENT_SECRET here:
      # build.rs (DCR-030) emits empty values when both are absent, and a
      # green build must not depend on repository secrets.
      - name: cargo tauri build
        working-directory: apps/tradr/src-tauri
        run: cargo tauri build

  # WI-M0-015b: this job measured 41 minutes (four ABIs, release, every
  # push). Local measurement found ABI count and release optimization
  # dominate the cost, not NDK/SDK fetch or Gradle assembly. Split below:
  # this job proves the toolchain on every push; android-release-toolchain
  # is the real ADR-0001 evidence, and runs less often.
  android-debug-smoke:
    name: "android-debug-smoke (aarch64, debug only -- not the release toolchain check)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - run: rustup show
      - run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-debug-aarch64

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gradle 8.14.3, which Tauri scaffolds, cannot read Java 25 class
      # files ("Unsupported class file major version 69", WI-M0-004), and
      # the Android Gradle Plugin does not support 25 either. The JDK is
      # pinned rather than trusting the runner's default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
      # Makes ANDROID_HOME available to the `${{ env.* }}` expressions
      # below, rather than assuming the action's own export reaches that
      # context too.
      - run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Cache Android SDK/NDK components
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          key: android-sdk-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-${{ runner.os }}
      - name: Install Android SDK/NDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "platforms;android-36" "platforms;android-35" "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}" "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Cache tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}
      - name: Install tauri-cli
        run: |
          # Swatinem/rust-cache restores ~/.cargo/bin too, so the cache
          # step above reporting a miss does not mean cargo-tauri is
          # absent -- check the binary itself, not that step's report.
          installed_version="$(cargo-tauri --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$installed_version" = "${{ env.TAURI_CLI_VERSION }}" ]; then
            echo "cargo-tauri ${{ env.TAURI_CLI_VERSION }} already present, skipping install"
          else
            cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked --force
          fi

      # Android never receives the OAuth secret at all (DCR-030); the
      # client ID list is also left unset here, matching the desktop job.
      # --debug -t aarch64: proves the toolchain compiles, links and
      # assembles. It does not stand in for the release, four-ABI build
      # below -- see android-release-toolchain.
      - name: cargo tauri android build (debug, aarch64 only)
        working-directory: apps/tradr/src-tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          cargo tauri android build --debug -t aarch64

  # android-release-toolchain: the real evidence for ADR-0001's third
  # withdrawal condition, "the Tauri 2 Android build passes reliably in
  # CI" -- four ABIs, release profile, matching what a release actually
  # ships. Run on a schedule and on pushes to main rather than on every
  # push, since that is where the 41 minutes measured.
  android-release-toolchain:
    name: "android-release-toolchain (four ABIs, release -- ADR-0001's withdrawal-condition evidence)"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - run: rustup show
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release-all-abi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gradle 8.14.3, which Tauri scaffolds, cannot read Java 25 class
      # files ("Unsupported class file major version 69", WI-M0-004), and
      # the Android Gradle Plugin does not support 25 either. The JDK is
      # pinned rather than trusting the runner's default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
      # Makes ANDROID_HOME available to the `${{ env.* }}` expressions
      # below, rather than assuming the action's own export reaches that
      # context too.
      - run: echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Cache Android SDK/NDK components
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          key: android-sdk-${{ env.ANDROID_NDK_VERSION }}-${{ env.ANDROID_BUILD_TOOLS_VERSION }}-${{ runner.os }}
      - name: Install Android SDK/NDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "platforms;android-36" "platforms;android-35" "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}" "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Cache tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}
      - name: Install tauri-cli
        run: |
          # Swatinem/rust-cache restores ~/.cargo/bin too, so the cache
          # step above reporting a miss does not mean cargo-tauri is
          # absent -- check the binary itself, not that step's report.
          installed_version="$(cargo-tauri --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "$installed_version" = "${{ env.TAURI_CLI_VERSION }}" ]; then
            echo "cargo-tauri ${{ env.TAURI_CLI_VERSION }} already present, skipping install"
          else
            cargo install tauri-cli --version ${{ env.TAURI_CLI_VERSION }} --locked --force
          fi

      # Android never receives the OAuth secret at all (DCR-030); the
      # client ID list is also left unset here, matching the desktop job.
      - name: cargo tauri android build (release, four ABIs)
        working-directory: apps/tradr/src-tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          cargo tauri android build
