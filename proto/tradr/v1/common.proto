syntax = "proto3";
package tradr.v1;

// Public information about a device. Used in Hello and in discovery results.
message DeviceInfo {
  bytes  device_id       = 1;  // BLAKE3(ed25519_pub)[0..16]
  bytes  ed25519_pub     = 2;  // 32 bytes. Signing and identity
  bytes  x25519_pub      = 3;  // 32 bytes. Noise static key
  string display_name    = 4;  // User-chosen name, max 64 bytes
  Platform platform      = 5;
  uint32 capabilities    = 6;  // Bitmask, see docs/03
}

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_LINUX       = 1;
  PLATFORM_WINDOWS     = 2;
  PLATFORM_MACOS       = 3;
  PLATFORM_ANDROID     = 4;
  PLATFORM_IOS         = 5;  // Future
}

// A Google-signed ID token whose nonce is BLAKE3(ed25519_pub || x25519_pub).
// On its own it proves that the holder of this Google account controls this key
// pair, verifiable against Google's JWKS alone. See docs/05.
message Attestation {
  string id_token   = 1;  // JWT (header.payload.signature)
  string issuer     = 2;  // Always "https://accounts.google.com". Reserved for future IdPs
  int64  issued_at  = 3;  // Convenience copy; the authoritative value is iat inside id_token
}

// Self-signed proof that x25519_pub belongs to the holder of the Ed25519 key.
// Strictly redundant while the Attestation nonce binds both keys, but it lets the
// X25519 key rotate on its own later.
message KeyBinding {
  bytes x25519_pub = 1;
  bytes signature  = 2;  // Ed25519("tradr-keybind-v1" || x25519_pub)
  int64 not_after  = 3;  // Unix seconds
}

message FileEntry {
  string relative_path = 1;
  EntryKind kind       = 2;
  uint64 size          = 3;  // Files only
  int64  mtime         = 4;  // Unix seconds
  uint32 mode          = 5;  // Low 9 bits of POSIX permissions; 0 where unavailable
  bytes  content_hash  = 6;  // BLAKE3 root, 32 bytes. Omitted in ListDir by default
  string mime          = 7;  // Only when detected
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE        = 1;
  ENTRY_KIND_DIRECTORY   = 2;
  ENTRY_KIND_SYMLINK     = 3;  // Listed but never transferred or followed in v1
}

message Error {
  ErrorCode code    = 1;
  string    message = 2;  // Human-readable. Never surfaced verbatim in the UI
  string    detail  = 3;  // For logs
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED       = 0;
  ERROR_CODE_UNAUTHENTICATED   = 1;  // Attestation verification failed
  ERROR_CODE_PERMISSION_DENIED = 2;  // Trust Tier or Share audience insufficient
  ERROR_CODE_NOT_FOUND         = 3;
  ERROR_CODE_INVALID_PATH      = 4;  // Rejected by sanitization
  ERROR_CODE_READ_ONLY         = 5;  // Write against a read-only Share
  ERROR_CODE_NO_SPACE          = 6;
  ERROR_CODE_INTEGRITY_FAILED  = 7;  // Hash mismatch
  ERROR_CODE_TOO_LARGE         = 8;  // Exceeds a transport limit such as BLE
  ERROR_CODE_RATE_LIMITED      = 9;
  ERROR_CODE_VERSION_MISMATCH  = 10;
  ERROR_CODE_INTERNAL          = 11;
}
