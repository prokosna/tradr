[package]
name = "tradr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Static + cdylib + rlib is the shape Tauri's mobile entry point needs;
# desktop only uses one of the three at a time.
[lib]
name = "tradr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2"
serde_json = "1"
tauri-plugin-tradr = { path = "../../../crates/tauri-plugin-tradr" }
